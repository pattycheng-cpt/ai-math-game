<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四年级数学闯关 - 拖拽游戏</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #4a3f8a; margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #f0f0ff;
            border-radius: 15px;
            padding: 12px 20px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #4a3f8a;
        }
        .question-box {
            background: #fff8e1;
            border: 3px dashed #ffb300;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .question-text { font-size: 22px; color: #333; margin-bottom: 10px; }
        .drop-zone {
            display: inline-block;
            min-width: 120px;
            min-height: 60px;
            border: 3px dashed #7c4dff;
            border-radius: 15px;
            background: #f3e5f5;
            margin: 10px;
            padding: 10px 20px;
            font-size: 24px;
            color: #7c4dff;
            font-weight: bold;
            transition: all 0.3s;
            vertical-align: middle;
        }
        .drop-zone.over { background: #e1bee7; transform: scale(1.05); }
        .drop-zone.correct { background: #c8e6c9; border-color: #4caf50; color: #2e7d32; }
        .drop-zone.wrong { background: #ffcdd2; border-color: #f44336; color: #c62828; animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .cards-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: linear-gradient(145deg, #ffffff, #e6e6fa);
            border: 3px solid #b39ddb;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
            color: #4a3f8a;
            cursor: grab;
            box-shadow: 0 6px 0 #9575cd, 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .card:active { cursor: grabbing; transform: translateY(4px); box-shadow: 0 2px 0 #9575cd; }
        .card.dragging { opacity: 0.5; }
        .card.hidden { visibility: hidden; }
        .btn {
            background: linear-gradient(145deg, #7c4dff, #651fff);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #4a148c;
            transition: all 0.2s;
            margin: 5px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a148c; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .feedback { font-size: 20px; font-weight: bold; min-height: 30px; margin-top: 10px; }
        .feedback.correct { color: #4caf50; }
        .feedback.wrong { color: #f44336; }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%;
            transition: width 0.5s;
            border-radius: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🚀 数学探险家</h1>
        <p class="subtitle">四年级 · 拖拽答题闯关</p>

        <div class="status-bar">
            <span>⭐ 星星: <span id="stars">0</span></span>
            <span>🏆 关卡: <span id="level">1</span>/5</span>
            <span>❤️ 生命: <span id="lives">3</span></span>
        </div>

        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

        <div id="gameArea">
            <div class="question-box">
                <div class="question-text" id="questionText">把正确的数字拖到框里</div>
                <div id="dropZones"></div>
            </div>
            <div class="cards-area" id="cardsArea"></div>
            <div class="feedback" id="feedback"></div>
            <button class="btn" id="nextBtn" disabled>下一题 ➡️</button>
        </div>

        <div id="winScreen" class="hidden">
            <h2>🎉 恭喜通关！</h2>
            <p>你获得了 <span id="finalStars">0</span> 颗星星！</p>
            <button class="btn" onclick="location.reload()">再玩一次 🔄</button>
        </div>
    </div>

    <script>
        // 题库：每个关卡包含多道题
        const levels = [
            {
                name: "整数王国",
                questions: [
                    { q: "58 247 的万位数值是？", answer: "50 000", options: ["50 000", "8 000", "200", "40"] },
                    { q: "6 个万 + 5 个千 + 2 个百 = ?", answer: "65 200", options: ["65 200", "6 520", "652", "65 020"] },
                    { q: "30 000 + 4 000 + 500 + 60 + 7 = ?", answer: "34 567", options: ["34 567", "3 457", "345 67", "34 507"] }
                ]
            },
            {
                name: "分数迷宫",
                questions: [
                    { q: "6/8 约分后是？", answer: "3/4", options: ["3/4", "2/3", "1/2", "4/5"] },
                    { q: "2/5 + 2/5 = ?", answer: "4/5", options: ["4/5", "2/10", "4/10", "1/5"] },
                    { q: "哪个是最简分数？", answer: "3/7", options: ["3/7", "4/8", "2/6", "5/10"] }
                ]
            },
            {
                name: "度量衡商店",
                questions: [
                    { q: "1.5 kg = ? g", answer: "1500 g", options: ["1500 g", "150 g", "15 g", "15000 g"] },
                    { q: "2.5 m = ? cm", answer: "250 cm", options: ["250 cm", "25 cm", "2500 cm", "25000 cm"] },
                    { q: "3 小时 = ? 分钟", answer: "180 分钟", options: ["180 分钟", "120 分钟", "300 分钟", "90 分钟"] }
                ]
            },
            {
                name: "几何拼图",
                questions: [
                    { q: "正方形有什么特点？", answer: "4个边长相等", options: ["4个边长相等", "3个边长相等", "对边不相等", "没有直角"] },
                    { q: "等边三角形有几条边相等？", answer: "3条", options: ["3条", "2条", "1条", "0条"] },
                    { q: "长方形有几个直角？", answer: "4个", options: ["4个", "2个", "1个", "0个"] }
                ]
            },
            {
                name: "时间与统计",
                questions: [
                    { q: "2小时30分 = ? 分钟", answer: "150分钟", options: ["150分钟", "120分钟", "230分钟", "90分钟"] },
                    { q: "从 8:15 到 9:45 经过多久？", answer: "1小时30分", options: ["1小时30分", "1小时15分", "2小时", "45分钟"] },
                    { q: "条形图用来做什么？", answer: "比较数量", options: ["比较数量", "测量长度", "计算面积", "画圆形"] }
                ]
            }
        ];

        let currentLevel = 0;
        let currentQuestion = 0;
        let stars = 0;
        let lives = 3;
        let answered = false;

        const questionText = document.getElementById('questionText');
        const dropZones = document.getElementById('dropZones');
        const cardsArea = document.getElementById('cardsArea');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        const starsSpan = document.getElementById('stars');
        const levelSpan = document.getElementById('level');
        const livesSpan = document.getElementById('lives');
        const progress = document.getElementById('progress');
        const gameArea = document.getElementById('gameArea');
        const winScreen = document.getElementById('winScreen');

        function shuffle(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            answered = false;
            nextBtn.disabled = true;
            feedback.textContent = '';
            feedback.className = 'feedback';
            const level = levels[currentLevel];
            const q = level.questions[currentQuestion];

            questionText.textContent = q.q;
            dropZones.innerHTML = `<div class="drop-zone" id="dropZone">拖到这里</div>`;

            const options = shuffle([...q.options]);
            cardsArea.innerHTML = options.map(opt => 
                `<div class="card" draggable="true" data-value="${opt}">${opt}</div>`
            ).join('');

            // 更新进度条
            const totalQ = levels.reduce((sum, l) => sum + l.questions.length, 0);
            const doneQ = levels.slice(0, currentLevel).reduce((sum, l) => sum + l.questions.length, 0) + currentQuestion;
            progress.style.width = (doneQ / totalQ * 100) + '%';

            setupDragAndDrop(q.answer);
        }

        function setupDragAndDrop(correctAnswer) {
            const cards = document.querySelectorAll('.card');
            const dropZone = document.getElementById('dropZone');

            cards.forEach(card => {
                card.addEventListener('dragstart', (e) => {
                    if (answered) return;
                    e.dataTransfer.setData('text', card.dataset.value);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => card.classList.remove('dragging'));

                // 触屏支持
                card.addEventListener('touchstart', handleTouchStart, { passive: false });
                card.addEventListener('touchmove', handleTouchMove, { passive: false });
                card.addEventListener('touchend', handleTouchEnd);
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!answered) dropZone.classList.add('over');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('over');
                if (answered) return;
                const value = e.dataTransfer.getData('text');
                checkAnswer(value, dropZone, correctAnswer);
            });

            // 触屏拖拽逻辑
            let touchCard = null;
            function handleTouchStart(e) {
                if (answered) return;
                touchCard = e.target.closest('.card');
                if (!touchCard) return;
                e.preventDefault();
                touchCard.classList.add('dragging');
            }
            function handleTouchMove(e) {
                if (!touchCard) return;
                e.preventDefault();
                const touch = e.touches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem && elem.id === 'dropZone') {
                    elem.classList.add('over');
                } else {
                    dropZone.classList.remove('over');
                }
            }
            function handleTouchEnd(e) {
                if (!touchCard) return;
                const touch = e.changedTouches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem && elem.id === 'dropZone') {
                    checkAnswer(touchCard.dataset.value, dropZone, correctAnswer);
                }
                touchCard.classList.remove('dragging');
                dropZone.classList.remove('over');
                touchCard = null;
            }
        }

        function checkAnswer(value, dropZone, correctAnswer) {
            if (answered) return;
            answered = true;
            nextBtn.disabled = false;

            if (value === correctAnswer) {
                dropZone.textContent = value;
                dropZone.classList.add('correct');
                feedback.textContent = '✅ 太棒了！答对了！';
                feedback.className = 'feedback correct';
                stars += 10;
                starsSpan.textContent = stars;
                // 隐藏拖拽的卡片
                document.querySelectorAll('.card').forEach(c => {
                    if (c.dataset.value === value) c.classList.add('hidden');
                });
            } else {
                dropZone.textContent = value;
                dropZone.classList.add('wrong');
                feedback.textContent = '❌ 再想想哦～ 正确答案是 ' + correctAnswer;
                feedback.className = 'feedback wrong';
                lives--;
                livesSpan.textContent = lives;
                if (lives <= 0) {
                    setTimeout(() => {
                        alert('生命用完了！点击确定重新开始。');
                        location.reload();
                    }, 800);
                }
            }
        }

        nextBtn.addEventListener('click', () => {
            const level = levels[currentLevel];
            if (currentQuestion < level.questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                // 下一关
                if (currentLevel < levels.length - 1) {
                    currentLevel++;
                    currentQuestion = 0;
                    levelSpan.textContent = currentLevel + 1;
                    alert(`🎉 恭喜通过「${level.name}」！进入下一关：${levels[currentLevel].name}`);
                    loadQuestion();
                } else {
                    // 通关
                    gameArea.classList.add('hidden');
                    winScreen.classList.remove('hidden');
                    document.getElementById('finalStars').textContent = stars;
                }
            }
        });

        // 启动游戏
        loadQuestion();
    </script>
</body>
</html>
